services:
  app:
    build: .
    container_name: whisper-app
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env.local
      - .env.docker
    environment:
      - NEXT_PRIVATE_DISABLE_TURBOPACK=1
    volumes:
      - .:/app
      - whisper-node-modules:/app/node_modules
      - whisper-next:/app/.next
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: whisper-db
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - whisper-pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  whisper-pg:
  whisper-node-modules:
  whisper-next:
